services:
  urnetwork:
    image: techroy23/docker-urnetwork:latest
    container_name: urnetwork
    platform: linux/amd64
    restart: always
    privileged: true
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      AUTH: userpass
      USER_AUTH: "example@gmail.com"
      PASSWORD: "mYv3rYsEcUr3dP@sSw0rD"
      PROVIDER_PORT: "8080"
      ALL_OPERATORS: "N"
      AUTO_REGISTER: "N"
      ALLOW_CLIENT_REGISTRATION: "auto"
      DEBUG: "false"
    volumes:
      - /path/to/your/proxy.txt:/app/proxy.txt
      # Keep provider identity and credentials across container re-creates.
      - urnetwork_data:/root/.urnetwork
    ports:
      - "8080:8080"

volumes:
  urnetwork_data:
