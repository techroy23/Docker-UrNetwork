services:
  urnetwork:
    image: techroy23/docker-urnetwork:latest
    container_name: urnetwork
    platform: linux/amd64
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.ip_unprivileged_port_start: "0"
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      AUTH: userpass
      USER_AUTH: "example@gmail.com"
      PASSWORD: "mYv3rYsEcUr3dP@sSw0rD"
      PROVIDER_PORT: "8080"
      ALL_OPERATORS: "N"
      AUTO_REGISTER: "N"
      ALLOW_CLIENT_REGISTRATION: "auto"
      DEBUG: "false"
    volumes:
      - type: bind
        source: /path/to/your/proxy.txt
        target: /app/proxy.txt
      # Keep provider identity and credentials across container re-creates.
      # Long syntax is the compose equivalent of `--mount type=volume,...`.
      - type: volume
        source: urnetwork_data
        target: /home/urnetwork/.urnetwork
      # To store the state in a host directory instead, replace the volume
      # entry above with (create it first, chown 1000:1000, never chmod 777):
      # - type: bind
      #   source: /path/to/urnetwork_data
      #   target: /home/urnetwork/.urnetwork
    ports:
      - "8080:8080"

volumes:
  urnetwork_data:
