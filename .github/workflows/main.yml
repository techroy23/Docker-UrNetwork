name: Generate_Docker_Image

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-sub-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.get_versions.outputs.update_needed }}
      latest: ${{ steps.get_versions.outputs.latest }}
      nightly_version: ${{ steps.get_versions.outputs.nightly }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # The stable urnetwork/connect track is no longer published. Only the
      # nightly urnetwork/build releases ship urnetwork-provider-* assets, so a
      # single lookup now drives the version check, README and image tags.
      - name: Detect Latest Nightly Version
        id: get_versions
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          auth=()
          if [[ -n "${GH_PAT:-}" ]]; then
            auth=(-H "Authorization: Bearer ${GH_PAT}")
          fi

          api="https://api.github.com/repos/urnetwork/build/releases"
          latest=""
          nightly=""
          page=1
          while [[ ${page} -le 10 ]]; do
            if ! releases=$(curl -fsSL "${auth[@]}" "${api}?page=${page}&per_page=10"); then
              echo "::warning::GitHub API request failed for ${api}?page=${page}"
              break
            fi

            count=$(jq 'if type == "array" then length else 0 end' <<<"${releases}")
            if [[ ${count} -eq 0 ]]; then
              break
            fi

            # The release list already embeds its assets, so no per-release call is needed.
            match=$(jq -r '[.[] | select(any(.assets[]?; .name | startswith("urnetwork-provider-")))]
                           | first
                           | [(.tag_name // ""), (.name // .tag_name // "")] | @tsv' <<<"${releases}")
            if [[ -n "${match}" ]]; then
              tag=${match%%$'\t'*}
              nightly=${match#*$'\t'}
              latest=${tag#v}
              break
            fi
            page=$((page + 1))
          done

          if [[ -z "${latest}" ]]; then
            echo "::warning::No urnetwork/build release with urnetwork-provider-* assets found; skipping image build."
          elif [[ ! "${latest}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::Ignoring unusable release tag '${latest}'; skipping image build."
            latest=""
          fi

          if [[ -f version.txt ]]; then
            stored=$(tr -d '[:space:]' < version.txt)
          else
            stored=""
          fi

          {
            echo "latest=${latest}"
            echo "nightly=${nightly}"
            echo "stored=${stored}"
            if [[ -n "${latest}" && "${latest}" != "${stored}" ]]; then
              echo "update_needed=true"
            else
              echo "update_needed=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Update version.txt
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        run: echo "${{ steps.get_versions.outputs.latest }}" > version.txt

      - name: Update README.md Build section
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          sed -i \
            "s|^[-*][[:space:]]*UrNetwork_nightly[[:space:]]v.*|- UrNetwork_nightly ${{ steps.get_versions.outputs.nightly }}|" \
            README.md

      - name: Commit version.txt back to the branch
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git add version.txt README.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping git commit/push."
            exit 0
          fi
          git commit -m "Update version.txt to ${{ steps.get_versions.outputs.latest }} [skip ci]"
          git remote set-url origin "https://${{ github.actor }}:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Set up QEMU
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set Up Docker Buildx
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image to GHCR & Docker Hub
        if: steps.get_versions.outputs.latest != '' && (steps.get_versions.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docker-urnetwork:${{ steps.get_versions.outputs.latest }}
            ghcr.io/${{ github.repository_owner }}/docker-urnetwork:latest
            docker.io/techroy23/docker-urnetwork:${{ steps.get_versions.outputs.latest }}
            docker.io/techroy23/docker-urnetwork:latest
          secrets: |
            id=gh_token,src=${{ secrets.GH_PAT }}
